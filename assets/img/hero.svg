<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 560" preserveAspectRatio="xMidYMid meet"
     role="img" aria-labelledby="heroTitle heroDesc">
  <title id="heroTitle">A construction site read by a neural network</title>
  <desc id="heroDesc">A building frame and tower crane stand above a ground section showing soil strata, a bored pile and a tunnel bore. Signals run from sensor points on the structure into a layered neural network beside an attention matrix.</desc>

  <style>
    .ink   { fill: none; stroke: var(--art-ink, #10151f); stroke-linecap: round; stroke-linejoin: round; }
    .w15   { stroke-width: 1.5; }
    .w11   { stroke-width: 1.1; }
    .w08   { stroke-width: .8; }
    .faint { stroke: var(--art-line, #cdd4de); stroke-width: 1; fill: none; }
    .blue  { stroke: var(--art-blue, #1f5fbf); fill: none; }
    .amber { stroke: var(--art-accent, #e2661a); fill: none; }
    .fAmber{ fill: var(--art-accent, #e2661a); }
    .fBlue { fill: var(--art-blue, #1f5fbf); }
    .fInk  { fill: var(--art-ink, #10151f); }

    /* ── soil ── */
    .s1 { fill: var(--art-accent, #e2661a); opacity: .07; }
    .s2 { fill: var(--art-blue,   #1f5fbf); opacity: .08; }
    .s3 { fill: var(--art-ink,    #10151f); opacity: .05; }
    .s4 { fill: var(--art-blue,   #1f5fbf); opacity: .05; }

    /* ── motion ── */
    .flow {
      stroke-dasharray: 3 21;
      animation: flow 5.5s linear infinite;
    }
    @keyframes flow { to { stroke-dashoffset: -96; } }

    .node { animation: breathe 6s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    @keyframes breathe { 0%, 100% { opacity: .55; } 50% { opacity: 1; } }

    .cell { animation: cell 7s ease-in-out infinite; }
    @keyframes cell { 0%, 100% { opacity: .18; } 45% { opacity: .92; } }

    .trolley { animation: trolley 11s ease-in-out infinite; }
    @keyframes trolley { 0%, 100% { transform: translateX(0); } 50% { transform: translateX(96px); } }

    .scan { animation: scan 9s ease-in-out infinite; }
    @keyframes scan {
      0%, 100% { transform: translateY(0);    opacity: .12; }
      50%      { transform: translateY(176px); opacity: .5; }
    }

    .rise { animation: rise 8s ease-in-out infinite; }
    @keyframes rise { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-4px); } }

    @media (prefers-reduced-motion: reduce) {
      .flow, .node, .cell, .trolley, .scan, .rise { animation: none; }
      .flow { stroke-dasharray: none; opacity: .5; }
      .node { opacity: .85; }
      .cell { opacity: .55; }
    }
  </style>

  <!-- ══════════ GROUND SECTION ══════════ -->
  <g>
    <path class="s1" d="M30 332c70-7 132 6 198 2s130-9 196-3 118 9 186 3v46c-68 6-120 3-186-3s-130-1-196 3-128 9-198 2Z"/>
    <path class="s2" d="M30 377c70-7 132 6 198 2s130-9 196-3 118 9 186 3v52c-68 6-120 0-186-5s-130 2-196 6-128 6-198-1Z"/>
    <path class="s3" d="M30 428c70 7 132 5 198 1s130-11 196-6 118 11 186 5v56c-68 6-120 1-186-4s-130 3-196 7-128 4-198-3Z"/>
    <path class="s4" d="M30 484c70 7 132 5 198 1s130-11 196-6 118 11 186 5v58H30Z"/>

    <path class="ink w11" d="M30 332c70-7 132 6 198 2s130-9 196-3 118 9 186 3"/>
    <path class="faint"   d="M30 377c70-7 132 6 198 2s130-9 196-3 118 9 186 3"/>
    <path class="faint"   d="M30 428c70 7 132 5 198 1s130-11 196-6 118 11 186 5"/>
    <path class="faint"   d="M30 484c70 7 132 5 198 1s130-11 196-6 118 11 186 5"/>
    <path class="ink w08" d="M30 542h580" opacity=".45"/>

    <!-- clast / texture ticks -->
    <g class="ink w08" opacity=".32">
      <path d="M64 398h9M112 411h7M168 392h8M300 404h9M356 396h7M470 408h8M528 399h9"/>
      <path d="M80 452h8M148 462h7M212 447h9M336 458h7M404 449h8M492 461h9M556 452h7"/>
      <path d="M96 508h8M176 515h7M260 503h9M368 512h7M452 505h8M540 511h7"/>
    </g>

    <!-- travelling scan line through the strata -->
    <path class="scan amber" d="M34 350c70-6 132 5 198 1s130-8 196-2 118 8 186 2" stroke-width="1.2"/>
  </g>

  <!-- ══════════ BUILDING FRAME ══════════ -->
  <g>
    <!-- columns -->
    <path class="ink w15" d="M52 148v184M100 148v184M148 148v184M196 148v184"/>
    <!-- floor slabs -->
    <path class="ink w11" d="M46 148h156M46 185h156M46 222h156M46 259h156M46 296h156"/>
    <!-- bracing -->
    <g class="faint">
      <path d="M52 185l48 37M100 222l48-37M100 259l48 37M148 296l48-37M52 296l48-37"/>
    </g>
    <!-- slab edge shading -->
    <g class="fInk" opacity=".08">
      <rect x="46" y="148" width="156" height="4"/>
      <rect x="46" y="222" width="156" height="4"/>
      <rect x="46" y="296" width="156" height="4"/>
    </g>
    <!-- footings -->
    <g class="ink w11">
      <path d="M42 332h20M90 332h20M138 332h20M186 332h20"/>
      <path d="M46 332l6-8h0M96 332l6-8M144 332l6-8M192 332l6-8" opacity=".5"/>
    </g>
    <!-- formwork panel being lifted -->
    <g class="rise">
      <rect x="112" y="196" width="26" height="58" class="ink w11" fill="var(--art-line,#cdd4de)" fill-opacity=".35"/>
      <path class="ink w08" d="M112 212h26M112 228h26M112 244h26" opacity=".55"/>
    </g>
  </g>

  <!-- ══════════ TOWER CRANE ══════════ -->
  <g>
    <!-- mast -->
    <path class="ink w15" d="M234 332V96M254 332V96"/>
    <path class="faint" d="M234 320l20-22 -20-22 20-22 -20-22 20-22 -20-22 20-22 -20-22 20-22 -20-22"/>
    <!-- slewing top -->
    <path class="ink w11" d="M228 96h32l-16-16z" fill="var(--art-accent,#e2661a)" fill-opacity=".25"/>
    <!-- jib -->
    <path class="ink w15" d="M186 80h224"/>
    <path class="ink w11" d="M186 92h224"/>
    <path class="faint" d="M198 80l14 12 14-12 14 12 14-12 14 12 14-12 14 12 14-12 14 12 14-12 14 12 14-12 14 12 14-12"/>
    <!-- tie bars -->
    <path class="ink w08" d="M244 62 398 80M244 62 194 80" opacity=".6"/>
    <path class="ink w11" d="M244 80V58"/>
    <!-- counterweight -->
    <rect x="182" y="82" width="26" height="14" class="ink w11" fill="var(--art-ink,#10151f)" fill-opacity=".16"/>
    <!-- trolley + hoist + load -->
    <g class="trolley">
      <rect x="286" y="74" width="18" height="9" class="ink w08" fill="var(--art-accent,#e2661a)" fill-opacity=".55"/>
      <path class="ink w08" d="M295 83v56"/>
      <path class="ink w11" d="M289 139h12l-6 9z"/>
      <rect x="281" y="150" width="28" height="16" class="ink w08" fill="var(--art-line,#cdd4de)" fill-opacity=".4"/>
    </g>
  </g>

  <!-- ══════════ BRIDGE ══════════ -->
  <g>
    <!-- deck -->
    <path class="ink w15" d="M300 292h300"/>
    <path class="ink w11" d="M300 305h300"/>
    <g class="fInk" opacity=".07"><rect x="300" y="292" width="300" height="13"/></g>
    <path class="faint" d="M312 292v13M336 292v13M360 292v13M384 292v13M408 292v13M432 292v13M456 292v13M480 292v13M504 292v13M528 292v13M552 292v13M576 292v13"/>
    <!-- parapet -->
    <path class="ink w08" d="M300 286h300" opacity=".45"/>
    <!-- piers -->
    <g class="ink w11">
      <path d="M368 305v27M382 305v27M508 305v27M522 305v27"/>
      <path d="M360 332h30M500 332h30"/>
    </g>
    <g class="fInk" opacity=".06">
      <rect x="368" y="305" width="14" height="27"/><rect x="508" y="305" width="14" height="27"/>
    </g>
  </g>

  <!-- ══════════ BORED PILE + TUNNEL ══════════ -->
  <g>
    <!-- bored pile under the frame -->
    <path class="ink w11" d="M138 332v152M160 332v152"/>
    <path class="ink w11" d="M138 484a11 6 0 0 0 22 0"/>
    <g class="faint" opacity=".7">
      <path d="M138 356h22M138 380h22M138 404h22M138 428h22M138 452h22M138 476h22"/>
    </g>
    <g class="fBlue" opacity=".07"><rect x="138" y="332" width="22" height="152"/></g>

    <!-- tunnel bore -->
    <circle cx="432" cy="442" r="46" class="ink w15" fill="var(--art-blue,#1f5fbf)" fill-opacity=".05"/>
    <circle cx="432" cy="442" r="38" class="faint"/>
    <path class="faint" d="M400 462h64" opacity=".8"/>
    <path class="ink w08" d="M414 470h36M420 478h24" opacity=".5"/>
    <path class="faint" d="M432 404v76M394 442h76" opacity=".35"/>
  </g>

  <!-- ══════════ SENSOR POINTS ══════════ -->
  <g>
    <circle cx="148" cy="185" r="3.4" class="fAmber"/>
    <circle cx="244" cy="212" r="3.4" class="fBlue"/>
    <circle cx="440" cy="292" r="3.4" class="fAmber"/>
    <circle cx="149" cy="478" r="3.4" class="fBlue"/>
    <circle cx="432" cy="404" r="3.4" class="fAmber"/>
    <g class="ink w08" opacity=".45">
      <path d="M148 178v-7M244 205v-7M440 285v-7M149 471v-7M432 397v-7"/>
    </g>
  </g>

  <!-- ══════════ SIGNAL PATHS: STRUCTURE → NETWORK ══════════ -->
  <g opacity=".55">
    <path class="amber w11" d="M148 185C260 150 320 140 408 132" stroke-width="1.1" fill="none"/>
    <path class="blue  w11" d="M244 212C310 205 350 190 408 176" stroke-width="1.1" fill="none"/>
    <path class="amber w11" d="M440 292C424 262 410 240 408 220" stroke-width="1.1" fill="none"/>
    <path class="blue  w11" d="M149 478C250 470 356 400 408 264" stroke-width="1.1" fill="none"/>
    <path class="amber w11" d="M432 404C420 360 404 320 408 264" stroke-width="1.1" fill="none"/>
  </g>
  <g>
    <path class="amber flow" d="M148 185C260 150 320 140 408 132" stroke-width="2.2"/>
    <path class="blue  flow" d="M244 212C310 205 350 190 408 176" stroke-width="2.2" style="animation-delay:-1.4s"/>
    <path class="amber flow" d="M440 292C424 262 410 240 408 220" stroke-width="2.2" style="animation-delay:-2.6s"/>
    <path class="blue  flow" d="M149 478C250 470 356 400 408 264" stroke-width="2.2" style="animation-delay:-3.7s"/>
    <path class="amber flow" d="M432 404C420 360 404 320 408 264" stroke-width="2.2" style="animation-delay:-4.8s"/>
  </g>

  <!-- ══════════ NEURAL NETWORK ══════════ -->
  <g>
    <!-- edges -->
    <g class="ink w08" opacity=".26">
      <path d="M414 132 466 120M414 132 466 158M414 132 466 196M414 176 466 120M414 176 466 158M414 176 466 232M414 220 466 158M414 220 466 196M414 220 466 268M414 264 466 196M414 264 466 232M414 264 466 268"/>
      <path d="M466 120 520 138M466 120 520 180M466 158 520 138M466 158 520 224M466 196 520 180M466 196 520 224M466 232 520 224M466 232 520 266M466 268 520 180M466 268 520 266"/>
      <path d="M520 138 576 162M520 138 576 202M520 180 576 162M520 180 576 242M520 224 576 202M520 224 576 242M520 266 576 242"/>
    </g>
    <!-- a few live edges -->
    <g>
      <path class="blue flow"  d="M414 132 466 158" stroke-width="1.8"/>
      <path class="amber flow" d="M466 196 520 224" stroke-width="1.8" style="animation-delay:-2.1s"/>
      <path class="blue flow"  d="M520 138 576 162" stroke-width="1.8" style="animation-delay:-3.3s"/>
      <path class="amber flow" d="M466 268 520 180" stroke-width="1.8" style="animation-delay:-1.1s"/>
    </g>

    <!-- nodes -->
    <g class="ink w11">
      <circle class="node" cx="414" cy="132" r="6" fill="var(--art-accent,#e2661a)" fill-opacity=".85"/>
      <circle class="node" cx="414" cy="176" r="5" fill="var(--art-blue,#1f5fbf)" fill-opacity=".8"  style="animation-delay:-1.1s"/>
      <circle class="node" cx="414" cy="220" r="5.5" fill="var(--art-accent,#e2661a)" fill-opacity=".8" style="animation-delay:-2.3s"/>
      <circle class="node" cx="414" cy="264" r="5" fill="var(--art-blue,#1f5fbf)" fill-opacity=".8"  style="animation-delay:-3.5s"/>

      <circle class="node" cx="466" cy="120" r="5" fill="none" style="animation-delay:-.7s"/>
      <circle class="node" cx="466" cy="158" r="6" fill="var(--art-blue,#1f5fbf)" fill-opacity=".75" style="animation-delay:-1.9s"/>
      <circle class="node" cx="466" cy="196" r="5" fill="none" style="animation-delay:-3.1s"/>
      <circle class="node" cx="466" cy="232" r="5.5" fill="var(--art-accent,#e2661a)" fill-opacity=".7" style="animation-delay:-4.3s"/>
      <circle class="node" cx="466" cy="268" r="4.5" fill="none" style="animation-delay:-5.5s"/>

      <circle class="node" cx="520" cy="138" r="5.5" fill="var(--art-accent,#e2661a)" fill-opacity=".75" style="animation-delay:-2.7s"/>
      <circle class="node" cx="520" cy="180" r="5" fill="none" style="animation-delay:-.4s"/>
      <circle class="node" cx="520" cy="224" r="6" fill="var(--art-blue,#1f5fbf)" fill-opacity=".75" style="animation-delay:-3.9s"/>
      <circle class="node" cx="520" cy="266" r="4.5" fill="none" style="animation-delay:-5.1s"/>

      <circle class="node" cx="576" cy="162" r="5.5" fill="var(--art-blue,#1f5fbf)" fill-opacity=".8" style="animation-delay:-1.6s"/>
      <circle class="node" cx="576" cy="202" r="6" fill="var(--art-accent,#e2661a)" fill-opacity=".8" style="animation-delay:-4.6s"/>
      <circle class="node" cx="576" cy="242" r="5" fill="none" style="animation-delay:-2.9s"/>
    </g>

    <!-- output ticks -->
    <path class="ink w08" d="M592 162h14M592 202h20M592 242h14" opacity=".5"/>
    <path class="amber" d="M610 202h10" stroke-width="1.6"/>
  </g>

  <!-- ══════════ ATTENTION MATRIX ══════════ -->
  <g transform="translate(524 24)">
    <rect x="0" y="0" width="84" height="72" class="faint" fill="var(--art-line,#cdd4de)" fill-opacity=".12"/>
    <g>
      <rect class="cell" x="6"  y="6"  width="10" height="10" fill="var(--art-blue,#1f5fbf)"   opacity=".2"/>
      <rect class="cell" x="20" y="6"  width="10" height="10" fill="var(--art-accent,#e2661a)" style="animation-delay:-.6s"/>
      <rect class="cell" x="48" y="6"  width="10" height="10" fill="var(--art-blue,#1f5fbf)"   style="animation-delay:-1.2s"/>
      <rect class="cell" x="6"  y="20" width="10" height="10" fill="var(--art-accent,#e2661a)" style="animation-delay:-1.8s"/>
      <rect class="cell" x="34" y="20" width="10" height="10" fill="var(--art-blue,#1f5fbf)"   style="animation-delay:-2.4s"/>
      <rect class="cell" x="62" y="20" width="10" height="10" fill="var(--art-accent,#e2661a)" style="animation-delay:-3s"/>
      <rect class="cell" x="20" y="34" width="10" height="10" fill="var(--art-blue,#1f5fbf)"   style="animation-delay:-3.6s"/>
      <rect class="cell" x="48" y="34" width="10" height="10" fill="var(--art-accent,#e2661a)" style="animation-delay:-4.2s"/>
      <rect class="cell" x="6"  y="48" width="10" height="10" fill="var(--art-blue,#1f5fbf)"   style="animation-delay:-4.8s"/>
      <rect class="cell" x="34" y="48" width="10" height="10" fill="var(--art-accent,#e2661a)" style="animation-delay:-5.4s"/>
      <rect class="cell" x="62" y="48" width="10" height="10" fill="var(--art-blue,#1f5fbf)"   style="animation-delay:-6s"/>
      <rect class="cell" x="48" y="62" width="10" height="6"  fill="var(--art-accent,#e2661a)" style="animation-delay:-2s"/>
    </g>
    <path class="faint" d="M14 0v72M28 0v72M42 0v72M56 0v72M70 0v72M0 14h84M0 28h84M0 42h84M0 56h84" opacity=".5"/>
  </g>
</svg>
